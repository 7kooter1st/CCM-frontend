[package]
name = "consumption-manager"
version = "0.1.0"
description = "CCM Frontend - Tauri"
edition = "2021"
rust-version = "1.70"

[lib]
name = "consumption_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["codegen"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-cors-fetch = "2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

